<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Modern</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        radial-gradient(circle at top left, #2f80ed, transparent 30%),
        radial-gradient(circle at bottom right, #9b51e0, transparent 30%),
        linear-gradient(135deg,#111827,#0f172a);
      overflow:hidden;
    }

    .calculator{
      width:370px;
      padding:22px;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.4),
        inset 0 0 20px rgba(255,255,255,0.03);
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
      color:white;
    }

    .title{
      font-size:18px;
      font-weight:600;
      letter-spacing:1px;
    }

    .mode{
      font-size:13px;
      opacity:0.7;
    }

    .display{
      width:100%;
      height:120px;
      border-radius:20px;
      padding:20px;
      border:none;
      outline:none;
      text-align:right;
      font-size:42px;
      background:rgba(0,0,0,0.25);
      color:white;
      margin-bottom:20px;
      overflow-x:auto;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
    }

    .history{
      font-size:16px;
      opacity:0.6;
      min-height:25px;
      margin-bottom:10px;
      word-wrap:break-word;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }

    button{
      height:70px;
      border:none;
      border-radius:20px;
      font-size:24px;
      cursor:pointer;
      transition:0.15s;
      color:white;
      background:rgba(255,255,255,0.08);
      box-shadow:
        0 5px 12px rgba(0,0,0,0.25),
        inset 0 1px 2px rgba(255,255,255,0.08);
    }

    button:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,0.12);
    }

    button:active{
      transform:scale(0.96);
    }

    .operator{
      background:linear-gradient(135deg,#ff8a00,#ff5e62);
    }

    .equal{
      background:linear-gradient(135deg,#00c6ff,#0072ff);
      grid-row:span 2;
      height:154px;
    }

    .zero{
      grid-column:span 2;
    }

    .special{
      background:linear-gradient(135deg,#434343,#232526);
    }

    .footer{
      margin-top:18px;
      text-align:center;
      color:rgba(255,255,255,0.5);
      font-size:12px;
      letter-spacing:1px;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="top-bar">
      <div class="title">CALCULATOR</div>
      <div class="mode">AMBATRON</div>
    </div>

    <div class="history" id="history"></div>

    <input type="text" class="display" id="display" value="0" disabled>

    <div class="buttons">

      <button class="special" onclick="clearDisplay()">AC</button>
      <button class="special" onclick="deleteLast()">⌫</button>
      <button class="special" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="zero" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="footer">
      Built with love
    </div>

  </div>

<script>

  const display = document.getElementById("display");
  const history = document.getElementById("history");

  let currentInput = "";

  function appendValue(value){

    if(display.value === "0" && value !== "."){
      currentInput = "";
    }

    currentInput += value;
    display.value = currentInput;
  }

  function clearDisplay(){
    currentInput = "";
    display.value = "0";
    history.innerText = "";
  }

  function deleteLast(){

    currentInput = currentInput.slice(0,-1);

    if(currentInput === ""){
      display.value = "0";
    }else{
      display.value = currentInput;
    }
  }

  function calculate(){

    try{

      let expression = currentInput.replace(/%/g,"/100");

      let result = eval(expression);

      history.innerText = currentInput + " =";

      display.value = result;

      currentInput = result.toString();

    }catch{

      display.value = "Error";
      currentInput = "";
    }
  }

  // Keyboard Support
  document.addEventListener("keydown", (e)=>{

    const key = e.key;

    if(!isNaN(key) || ['+','-','*','/','.','%'].includes(key)){
      appendValue(key);
    }

    else if(key === "Enter"){
      calculate();
    }

    else if(key === "Backspace"){
      deleteLast();
    }

    else if(key.toLowerCase() === "c"){
      clearDisplay();
    }
  });

</script>

</body>
</html>
